version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purplle_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./pipeline:/app/pipeline
    environment:
      - DB_PATH=/app/data/store.db
      - POS_FILE=/app/data/resources/pos_transactions.csv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purplle_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - API_BASE=http://api:8000
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
